name: Bug report
description: Reporta un fallo del CLI
labels: [bug]
body:
  - type: input
    id: cli-version
    attributes:
      label: Versión del CLI
      description: Salida de `minecraftdecompiler version`
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Versión de Minecraft
      placeholder: 1.8.9
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando exacto
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Salida relevante (stderr/stdout)
      render: shell
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: java -version
      placeholder: openjdk 25 ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [Windows, Linux, macOS]
    validations:
      required: true
