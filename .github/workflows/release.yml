name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag a publicar (ej. v1.1.0). Debe coincidir con Version del CLI."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: build (linux, windows, macos)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o minecraftdecompiler-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o minecraftdecompiler-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o minecraftdecompiler-darwin-arm64 .
      - name: tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
            TAG="$(echo "$TAG" | tr -d '[:space:]')"
            echo "tag recibido: '$TAG'"
            case "$TAG" in
              v*) ;;
              *) echo "ERROR: el campo version llegó vacío o sin 'v'. Escribe ej. v1.1.0 en el formulario y reintenta."; exit 1;;
            esac
            git tag "$TAG"
            git push origin "$TAG"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" --generate-notes \
            minecraftdecompiler-linux-amd64 minecraftdecompiler-windows-amd64.exe minecraftdecompiler-darwin-arm64
