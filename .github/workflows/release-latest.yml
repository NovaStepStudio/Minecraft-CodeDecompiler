name: Release Latest

# Mantiene actualizado un release rodante `latest` (prerelease) con cada
# cambio en main. Los tags v* siguen generando releases estables.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o minecraftdecompiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - name: upload
        uses: actions/upload-artifact@v5
        with:
          name: minecraftdecompiler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: minecraftdecompiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: refresh latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --title "Latest (main)" \
            --notes "Compilación automática de la rama main. Para versiones estables usa los tags v*." \
            dist/*
